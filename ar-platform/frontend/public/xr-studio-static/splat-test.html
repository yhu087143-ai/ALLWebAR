<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>splat-standalone</title>
    <style>
      html, body { margin: 0; height: 100%; background: #222226; overflow: hidden; }
      canvas { display: block; }
      #status { position: fixed; top: 8px; left: 8px; color: #fff; font: 13px monospace; z-index: 10; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "@mkkellogg/gaussian-splats-3d": "/node_modules/@mkkellogg/gaussian-splats-3d/build/gaussian-splats-3d.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">loading…</div>
    <script type="module">
      import * as THREE from 'three'
      import { DropInViewer } from '@mkkellogg/gaussian-splats-3d'

      const statusEl = document.getElementById('status')
      const setStatus = (t) => { statusEl.textContent = t; document.title = t }
      setStatus('v3 loading…')

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      document.body.appendChild(renderer.domElement)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x222226)
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500)
      camera.position.set(9, 5.5, 9)
      camera.lookAt(0, 1.2, -1)

      const gl = renderer.getContext()
      function sampleOnce(label) {
        renderer.render(scene, camera) // 同一任务内渲染后立刻读像素（preserveDrawingBuffer=false 也有效）
        const w = gl.drawingBufferWidth
        const h = gl.drawingBufferHeight
        const pts = []
        for (let iy = 0; iy < 5; iy++) {
          for (let ix = 0; ix < 5; ix++) {
            const px = new Uint8Array(4)
            gl.readPixels(Math.floor(((ix + 0.5) / 5) * w), Math.floor(((iy + 0.5) / 5) * h), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px)
            pts.push([px[0], px[1], px[2]])
          }
        }
        const distinct = new Set(pts.map((p) => p.join(','))).size
        const sum = pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1], a[2] + p[2]], [0, 0, 0])
        const avg = sum.map((v) => Math.round(v / pts.length))
        console.log('[standalone]', label, 'distinct', distinct, '/25 avg', avg.join(','))
        return { label, distinct, avg, pts }
      }

      const viewer = new DropInViewer({ gpuAcceleratedSort: false, sharedMemoryForWorkers: false })
      scene.add(viewer)

      viewer
        .addSplatScene('/samples/gs-demo-room.ply', { showLoadingUI: false })
        .then(() => {
          // 等 5 帧让排序 worker 跑一轮，再在两个机位各采样一次
          let wait = 5
          const waitFrames = () => {
            if (wait-- > 0) return requestAnimationFrame(waitFrames)
            const reports = []
            camera.position.set(9, 5.5, 9); camera.lookAt(0, 1.2, -1)
            reports.push(sampleOnce('outside(9,5.5,9)'))
            camera.position.set(0, 1.6, 3.5); camera.lookAt(0, 1.8, -1.5)
            reports.push(sampleOnce('inside(0,1.6,3.5)'))
            window.__pixelReports = reports
            const r = reports[0]
            setStatus('v3 outside distinct ' + r.distinct + '/25 avg ' + r.avg.join(',') + ' · inside ' + reports[1].distinct + '/25 ' + reports[1].avg.join(','))
          }
          requestAnimationFrame(waitFrames)
        })
        .catch((err) => {
          console.error('[standalone] load failed', err)
          setStatus('SPLAT-ERROR: ' + (err && err.message))
        })

      let frames = 0
      function tick() {
        requestAnimationFrame(tick)
        renderer.render(scene, camera)
        frames++
      }
      tick()
    </script>
  </body>
</html>
