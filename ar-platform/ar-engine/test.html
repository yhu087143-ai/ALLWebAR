<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Engine 独立测试</title>
  <style>
    body { margin: 0; padding: 0; background: #000; color: #fff; font-family: system-ui; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="status">Loading AR Engine...</div>

  <script type="module">
    import { AREngine } from './dist/index.js';

    const statusEl = document.getElementById('status');

    if (typeof AREngine === 'function') {
      statusEl.textContent = 'AR Engine loaded successfully (AREngine is function)';
      statusEl.style.color = '#0f0';
      console.log('AR Engine loaded:', typeof AREngine);
    } else {
      statusEl.textContent = 'AR Engine loaded but AREngine is not a function: ' + typeof AREngine;
      statusEl.style.color = '#f00';
      console.warn('AR Engine unexpected type:', typeof AREngine);
    }
  </script>
</body>
</html>
